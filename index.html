<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <section id="landing">
      <div class="row">
        <nav>
          <div class="logo__container">
            <img class="logo" src="assets/Treact.svg" />
            <h2 class="logo__title">Treact</h2>
          </div>
          <ul class="nav__links">
            <li>
              <a href="#" class="nav__link">About</a>
            </li>
            <li>
              <a href="#" class="nav__link">Blog</a>
            </li>
            <li>
              <a href="#" class="nav__link">Pricing</a>
            </li>
            <li>
              <a href="#" class="nav__link">Contact Us</a>
            </li>
            <li>
              <a href="#" class="nav__link">Login</a>
            </li>
            <li>
              <a href="#" class="nav__link nav__link--primary">Sign Up</a>
            </li>
          </ul>
        </nav>
      </div>
      <header>
        <div class="container">
          <div class="row">
            <div class="header__description">
              <h1>
                Beautiful React Templates <span class="purple">for you.</span>
              </h1>
              <p class="header__description--para">
                Our templates are easy to setup, understand and customize. Fully
                modular components with a variety of pages and components.
              </p>
              <div class="header__email">
                <input
                  type="text"
                  class="header__email--input"
                  placeholder="Your E-mail Address"
                />
                <button class="header__email--btn">Get Started</button>
              </div>
              <p class="header__customers--title">OUR TRUSTED CUSTOMERS</p>
              <img src="assets/customers.png" class="header__customers" />
            </div>
            <figure class="header__img--wrapper">
              <img src="assets/Computer.svg" class="header__img" />
            </figure>
          </div>
        </div>
      </header>
    </section>
  </body>
</html>
